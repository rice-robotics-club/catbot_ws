controller_manager:
  ros__parameters:
    update_rate: 10 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_position_controller:
      type: position_controllers/JointGroupPositionController

joint_position_controller:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint

joint_state_broadcaster:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint
