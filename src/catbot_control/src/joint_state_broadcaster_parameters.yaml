catbot_control:
  frame_id:
    {
      type: string,
      default_value: "base_link",
      read_only: true,
      description: "The frame_id to be used in the published joint states. This parameter allows rviz2 to visualize the effort of the joints.",
    }
  joint_names:
    { type: string_array, default_value: [], read_only: true, description: "" }
  position_offsets:
    { type: double_array, default_value: [], read_only: true, description: "" }
  publish_dynamic_joint_states:
    {
      type: bool,
      default_value: true,
      read_only: true,
      description: "Whether to publish dynamic joint states.",
    }
